appId: com.agentone.app
productName: AgentOne
copyright: Copyright © 2026 AgentOne

directories:
  output: release

# Do NOT let electron-builder rebuild native deps: its @electron/rebuild step
# pulls a PREBUILT better-sqlite3 for the host Node ABI (v93 / Node 16), which
# crashes the packaged app at import (Electron needs v113). Instead we compile
# better-sqlite3 from source against Electron's headers via `npm run rebuild:electron`
# BEFORE packaging (see package.json / PACKAGING.md), and package it as-is.
npmRebuild: false

# App files. Production node_modules (better-sqlite3 + its deps) are included by
# electron-builder automatically and pruned of devDependencies — do NOT hand-list
# node_modules here (the old !node_modules + manual re-include missed transitive
# deps like `bindings`). Native modules are rebuilt for Electron's ABI on pack.
files:
  - dist/**/*
  - src/personas/**/*
  - package.json

# better-sqlite3 ships a native .node that cannot be loaded from inside the asar
# archive — unpack it so require() at runtime finds the binary.
asarUnpack:
  - node_modules/better-sqlite3/**/*

# Bundle the Node 22 binary for openclaw (the staging script populates build/node22-bin/)
extraResources:
  - from: build/node22-bin
    to: node22-bin
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Unsigned local build (no Apple Developer cert). Signing/notarization are
  # gated on env vars — set CSC_LINK/CSC_KEY_PASSWORD + Apple ID credentials to enable.
  # By default (no env), identity: null disables signing so the build succeeds locally.
  identity: null
  # Signing + notarization config (ENV-GATED — only active when credentials are set):
  # To enable, set these environment variables:
  #   CSC_LINK=<path-to-certificate.p12>
  #   CSC_KEY_PASSWORD=<certificate-password>
  #   APPLE_ID=<your-apple-id@example.com>
  #   APPLE_APP_SPECIFIC_PASSWORD=<app-specific-password>
  #   APPLE_TEAM_ID=<your-team-id>
  # Then remove or comment out "identity: null" above.
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # notarize:
  #   teamId: ${APPLE_TEAM_ID}
  target:
    - target: dmg
      arch:
        - arm64
        - x64

publish: null
